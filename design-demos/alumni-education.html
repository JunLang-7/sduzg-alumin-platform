<!doctype html>
<!-- Issue #236: retain the existing detail page; separate personal information from academic records. Synthetic data only. -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>校友详情 · 多段学籍设计</title>
    <style>
      :root {
        --red: #a7190f;
        --dark: #7e1009;
        --line: #eadfdc;
        --ink: #241817;
        --muted: #746764;
        --page: #f6f2ef;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--page);
        font:
          14px/1.6 -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          "Microsoft YaHei",
          sans-serif;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
        border: 1px solid #d9d9d9;
        border-radius: 6px;
        background: white;
        padding: 6px 15px;
        color: var(--ink);
      }
      button:hover {
        color: var(--red);
        border-color: var(--red);
      }
      input,
      select {
        padding: 7px 10px;
        border: 1px solid #d9d9d9;
        border-radius: 6px;
        background: white;
        min-width: 0;
        color: var(--ink);
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: 3px solid #dba69b;
        outline-offset: 2px;
      }
      .primary {
        background: var(--red);
        border-color: var(--red);
        color: white;
      }
      .primary:hover {
        background: var(--dark);
        color: white;
      }
      .link {
        border: 0;
        padding: 0;
        background: none;
        color: #1677ff;
      }
      .danger {
        color: #ff4d4f;
      }
      .muted {
        color: var(--muted);
      }
      .header {
        background: var(--red);
        color: white;
      }
      .header-inner {
        max-width: 1440px;
        margin: auto;
        min-height: 92px;
        padding: 18px 44px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }
      .header img {
        width: 425px;
        max-width: 66%;
        max-height: 62px;
        object-fit: contain;
      }
      .user {
        text-align: right;
        font-size: 13px;
      }
      .user b {
        display: block;
        font-weight: 500;
      }
      .nav {
        background: var(--dark);
      }
      .nav-inner {
        max-width: 1160px;
        margin: auto;
        display: flex;
        overflow: auto;
      }
      .nav span {
        padding: 16px 25px;
        white-space: nowrap;
        font-weight: 600;
      }
      .nav .active {
        background: #ffffff1f;
      }
      .preview {
        border-bottom: 1px solid var(--line);
        background: #fffaf7;
      }
      .preview-inner {
        max-width: 1440px;
        margin: auto;
        padding: 8px 44px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        font-size: 12px;
        color: var(--muted);
      }
      .preview label {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .preview select {
        font-size: 12px;
        padding: 4px 8px;
      }
      main {
        max-width: 1440px;
        margin: auto;
        padding: 30px 44px 48px;
      }
      .page-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 18px;
        margin-bottom: 20px;
      }
      .page-header h1 {
        font-size: 28px;
        font-weight: 900;
        color: var(--red);
      }
      .card {
        background: white;
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 10px 26px #48120c0d;
        margin-top: 16px;
        overflow: hidden;
      }
      .card-head {
        min-height: 56px;
        padding: 16px 24px;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .card-head h2 {
        font-size: 16px;
        font-weight: 600;
      }
      .card-body {
        padding: 24px;
      }
      .descriptions {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        border: 1px solid #f0f0f0;
        border-radius: 8px;
        overflow: hidden;
      }
      .pair {
        display: grid;
        grid-template-columns: minmax(90px, 0.85fr) minmax(0, 1.6fr);
        margin: 0;
        border-right: 1px solid #f0f0f0;
        border-bottom: 1px solid #f0f0f0;
        min-height: 55px;
      }
      .pair:nth-child(3n) {
        border-right: 0;
      }
      .pair dt {
        background: #fafafa;
        padding: 15px 20px;
        color: #595959;
        font-weight: 500;
        border-right: 1px solid #f0f0f0;
        display: flex;
        align-items: center;
      }
      .pair dd {
        margin: 0;
        padding: 15px 20px;
        overflow-wrap: anywhere;
        display: flex;
        align-items: center;
      }
      .pair:last-child {
        border-bottom: 0;
      }
      .personal .pair:nth-child(n + 7) {
        border-bottom: 0;
      }
      .span2 {
        grid-column: span 2;
        grid-template-columns: minmax(90px, 0.85fr) minmax(0, 4.2fr);
        border-right: 0;
      }
      .academic .pair:nth-child(n + 7) {
        border-bottom: 0;
      }
      .academic-section {
        margin-top: 24px;
      }
      .section-label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 12px;
      }
      .section-label h2 {
        font-size: 18px;
      }
      .academic-record {
        margin-top: 12px;
      }
      .academic-record > summary {
        list-style: none;
        cursor: pointer;
        padding: 17px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .academic-record > summary::-webkit-details-marker {
        display: none;
      }
      .academic-record[open] > summary {
        border-bottom: 1px solid var(--line);
      }
      .summary-title {
        font-size: 16px;
        font-weight: 600;
        display: flex;
        gap: 13px;
        align-items: center;
        flex-wrap: wrap;
      }
      .summary-meta {
        font-weight: 400;
        font-size: 13px;
        color: var(--muted);
      }
      .chevron {
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
      }
      .chevron:before {
        content: "展开　⌄";
      }
      .academic-record[open] .chevron:before {
        content: "收起　⌃";
      }
      .record-section-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 16px;
      }
      .record-section-title h3 {
        font-size: 14px;
        font-weight: 600;
      }
      .files-heading {
        margin-top: 24px;
        padding-top: 22px;
        border-top: 1px solid var(--line);
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 16px;
      }
      .file-box {
        border: 1px solid #f0f0f0;
        border-radius: 8px;
        overflow: hidden;
        margin-top: 16px;
      }
      .file-box-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 9px 12px;
        border-bottom: 1px solid var(--line);
        gap: 10px;
        min-height: 40px;
      }
      .file-box-head strong {
        font-size: 14px;
        font-weight: 600;
      }
      .file-kind {
        font-size: 12px;
        border: 1px solid #91caff;
        background: #e6f4ff;
        color: #0958d9;
        border-radius: 4px;
        padding: 1px 7px;
        margin-right: 10px;
      }
      .file-kind.green {
        color: #389e0d;
        border-color: #b7eb8f;
        background: #f6ffed;
      }
      .file-empty {
        padding: 12px;
        color: #333;
      }
      .file-row {
        padding: 11px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        border-bottom: 1px solid #f0f0f0;
        font-size: 13px;
      }
      .file-row:last-child {
        border-bottom: 0;
      }
      .file-row > span {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .file-actions {
        display: flex;
        gap: 16px;
        flex-shrink: 0;
      }
      .empty {
        padding: 35px;
        text-align: center;
        color: var(--muted);
      }
      .audit-head {
        justify-content: flex-start;
        gap: 9px;
      }
      .history-mark {
        color: var(--red);
        font-size: 22px;
        line-height: 1;
      }
      .audit-table,
      .diff-table {
        border-collapse: collapse;
        width: 100%;
        text-align: left;
      }
      .audit-table th,
      .audit-table td,
      .diff-table th,
      .diff-table td {
        padding: 13px 20px;
        border-bottom: 1px solid #f0f0f0;
        font-size: 13px;
        overflow-wrap: anywhere;
      }
      .audit-table th,
      .diff-table th {
        background: #fffaf7;
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
      }
      .scroll {
        overflow: auto;
      }
      .tag {
        font-size: 12px;
        background: #fffaf7;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 2px 7px;
        color: var(--muted);
      }
      .tag.action {
        color: #389e0d;
        border-color: #b7eb8f;
        background: #f6ffed;
      }
      .empty-history {
        padding: 30px;
        text-align: center;
        color: #999;
      }
      .caption {
        font-size: 12px;
        color: var(--muted);
        margin-top: 12px;
      }
      .dialog {
        width: min(630px, calc(100vw - 32px));
        max-height: 90vh;
        border: 0;
        padding: 0;
        border-radius: 8px;
        box-shadow: 0 20px 80px #0004;
        color: var(--ink);
      }
      .dialog::backdrop {
        background: #0006;
      }
      .dialog-head {
        position: sticky;
        top: 0;
        z-index: 1;
        background: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 24px;
        border-bottom: 1px solid var(--line);
      }
      .dialog-head h2 {
        font-size: 17px;
      }
      .close {
        border: 0;
        padding: 0 3px;
        color: #888;
        font-size: 23px;
        line-height: 1;
        background: none;
      }
      .dialog-body {
        padding: 20px 24px;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .form-grid label {
        display: grid;
        gap: 6px;
        font-size: 13px;
      }
      .required {
        color: var(--red);
        margin-left: 3px;
      }
      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        border-top: 1px solid var(--line);
        padding: 14px 24px;
        background: white;
        position: sticky;
        bottom: 0;
        z-index: 1;
      }
      .error {
        color: var(--red);
        font-size: 12px;
        margin-top: 12px;
      }
      .toast {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        padding: 11px 20px;
        border-radius: 6px;
        background: #241817;
        color: white;
        z-index: 9;
        max-width: 90vw;
        font-size: 13px;
      }
      .filters {
        display: flex;
        align-items: end;
        gap: 12px;
        flex-wrap: wrap;
      }
      .filters label {
        display: grid;
        gap: 5px;
        font-size: 12px;
      }
      .list-link {
        color: var(--red);
        font-weight: 600;
      }
      .record-help {
        font-size: 12px;
        color: var(--muted);
        margin-top: 13px;
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 900px) {
        main {
          padding: 24px;
        }
        .header-inner,
        .preview-inner {
          padding-left: 24px;
          padding-right: 24px;
        }
        .descriptions {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .pair:nth-child(3n) {
          border-right: 1px solid #f0f0f0;
        }
        .pair:nth-child(2n) {
          border-right: 0;
        }
        .personal .pair,
        .academic .pair {
          border-bottom: 1px solid #f0f0f0;
        }
        .personal .pair:nth-child(7) {
          border-bottom: 1px solid #f0f0f0;
        }
        .pair.span2 {
          grid-column: span 1;
          grid-template-columns: minmax(90px, 0.85fr) minmax(0, 1.6fr);
        }
        .personal .pair:last-child {
          border-bottom: 0;
        }
        .pair dt,
        .pair dd {
          padding: 12px;
        }
        .audit-table {
          min-width: 650px;
        }
      }
      @media (max-width: 600px) {
        main {
          padding: 20px 16px;
        }
        .header-inner {
          padding: 15px 16px;
          min-height: 75px;
        }
        .header img {
          max-width: 95%;
          width: 350px;
        }
        .user {
          display: none;
        }
        .nav span {
          padding: 12px 17px;
          font-size: 13px;
        }
        .preview-inner {
          padding: 8px 16px;
          align-items: flex-start;
          flex-direction: column;
          gap: 6px;
        }
        .preview label {
          width: 100%;
          justify-content: space-between;
        }
        .page-header h1 {
          font-size: 25px;
        }
        .card-head,
        .academic-record > summary {
          padding: 15px 16px;
        }
        .card-body {
          padding: 16px;
        }
        .descriptions {
          grid-template-columns: 1fr;
        }
        .pair,
        .pair.span2 {
          grid-template-columns: 92px minmax(0, 1fr);
          border-right: 0 !important;
          grid-column: auto;
        }
        .personal .pair,
        .academic .pair {
          border-bottom: 1px solid #f0f0f0;
        }
        .personal .pair:last-child,
        .academic .pair:last-child {
          border-bottom: 0;
        }
        .summary-title {
          gap: 4px 10px;
        }
        .summary-meta {
          width: 100%;
          font-size: 12px;
        }
        .form-grid {
          grid-template-columns: 1fr;
        }
        .dialog-head,
        .dialog-body,
        .dialog-actions {
          padding-left: 18px;
          padding-right: 18px;
        }
        .section-label h2 {
          font-size: 17px;
        }
        .file-actions {
          gap: 10px;
        }
        .file-box-head {
          padding: 9px 10px;
        }
        .file-kind {
          margin-right: 5px;
        }
        .filters label {
          width: 100%;
        }
        .filters input,
        .filters select {
          width: 100%;
        }
      }

      .editor-dialog {
        width: min(820px, calc(100vw - 32px));
        height: min(850px, 90vh);
        max-height: 90vh;
        overflow: hidden;
      }
      .editor-dialog form {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .editor-dialog .dialog-head {
        flex-shrink: 0;
      }
      .edit-context {
        padding: 11px 24px;
        background: #fffaf7;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
        flex-shrink: 0;
      }
      .edit-tabs {
        display: flex;
        gap: 24px;
        padding: 0 24px;
        border-bottom: 1px solid var(--line);
        background: white;
        flex-shrink: 0;
      }
      .edit-tabs button {
        border: 0;
        border-radius: 0;
        padding: 12px 2px;
        color: var(--muted);
        background: none;
      }
      .edit-tabs button.active {
        color: var(--red);
        box-shadow: inset 0 -2px var(--red);
      }
      .editor-scroll {
        overflow-y: auto;
        flex: 1;
        min-height: 0;
        padding: 22px 24px;
      }
      .editor-dialog .dialog-actions {
        flex-shrink: 0;
        position: static;
      }
      .editor-fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px 20px;
      }
      .editor-fields label {
        display: grid;
        gap: 6px;
        font-size: 13px;
        align-content: start;
      }
      .editor-fields input,
      .editor-fields select,
      .editor-fields textarea {
        width: 100%;
        font: inherit;
        padding: 7px 10px;
        min-width: 0;
        border: 1px solid #d9d9d9;
        border-radius: 6px;
        color: var(--ink);
        background: white;
      }
      .editor-fields textarea {
        resize: vertical;
        min-height: 76px;
      }
      .editor-fields .full {
        grid-column: 1/-1;
      }
      .editor-fields select:disabled {
        background: #f5f5f5;
        color: #888;
        cursor: not-allowed;
      }
      .edit-record {
        border: 1px solid var(--line);
        border-radius: 7px;
        margin-top: 18px;
        overflow: hidden;
      }
      .edit-record:first-child {
        margin-top: 0;
      }
      .edit-record-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        background: #fffaf7;
        border-bottom: 1px solid var(--line);
      }
      .edit-record-head h3 {
        font-size: 14px;
        font-weight: 600;
      }
      .edit-record-body {
        padding: 18px 16px;
      }
      .edit-record .files-heading {
        margin-top: 20px;
        padding-top: 18px;
      }
      .edit-section-foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin: 20px 0 0;
      }
      .edit-section-foot small {
        color: var(--muted);
        font-size: 12px;
      }
      .edit-notice {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 16px;
      }
      .form-error {
        font-size: 12px;
        color: var(--red);
        padding: 9px 24px;
        background: #fff2f0;
        flex-shrink: 0;
      }
      .academic-record > .card-head {
        font-size: 16px;
        font-weight: 600;
        justify-content: flex-start;
      }
      .academic-record .summary-meta {
        font-size: 13px;
        font-weight: 400;
      }
      .view-caption {
        font-size: 12px;
        color: var(--muted);
        margin: 8px 0 0;
      }
      .audit-table td:last-child {
        white-space: nowrap;
      }
      .editor-action-pair {
        display: flex;
        gap: 14px;
      }
      @media (max-width: 600px) {
        .editor-dialog {
          height: 92vh;
          max-height: 92vh;
        }
        .editor-fields {
          grid-template-columns: 1fr;
        }
        .editor-fields .full {
          grid-column: auto;
        }
        .editor-scroll {
          padding: 16px;
        }
        .edit-context,
        .edit-tabs {
          padding-left: 18px;
          padding-right: 18px;
        }
        .edit-record-body {
          padding: 16px 12px;
        }
        .edit-section-foot {
          align-items: flex-start;
          flex-direction: column;
        }
        .edit-record-head {
          padding: 12px;
        }
        .academic-record .card-head {
          align-items: flex-start;
          flex-direction: column;
          gap: 4px;
        }
        .editor-action-pair {
          gap: 10px;
        }
      }
    </style>
  </head>
  <body>
    <header class="header">

    <dialog

      <form id="alumniForm" novalidate>
        <div class="dialog-head">
          <h2 id="editorTitle">编辑校友</h2>
          <button
            type="button"
            class="close"
            data-close="editor"
            aria-label="关闭编辑"
          >
            ×
          </button>
        </div>
        <div class="edit-context" id="editContext"></div>
        <div class="edit-tabs" role="tablist" aria-label="编辑分区">
          <button
            type="button"
            role="tab"
            id="personalTab"
            aria-controls="personalPanel"
            data-tab="personal"
          >
            个人信息</button
          ><button
            type="button"
            role="tab"
            id="recordsTab"
            aria-controls="recordsPanel"
            data-tab="records"
          >
            学籍与档案
          </button>
        </div>
        <div class="editor-scroll" id="editorScroll">
          <section
            id="personalPanel"
            role="tabpanel"
            aria-labelledby="personalTab"
          ></section>
          <section
            id="recordsPanel"
            role="tabpanel"
            aria-labelledby="recordsTab"
          ></section>
        </div>
        <div class="form-error" id="formError" role="alert" hidden></div>
        <div class="dialog-actions">
          <button type="button" data-close="editor">取消</button
          ><button type="submit" class="primary">保存全部修改</button>
        </div>

    <script>
      const domains = {
        undergraduate: "本科生",
        academic_graduate: "学术学位研究生",
        mpa: "MPA专业学位研究生",
      };
      const people = [
        {
          id: 1,
          name: "张同学",
          gender: "男",
          mobile: "138 **** 0001",
          email: "alumni@example.com",
          industry: "公共管理",
          unit: "示例公共服务单位",
          position: "项目主管",
          address: "示例通讯地址",
          records: [
            {
              id: 11,
              domain: "undergraduate",
              level: "本科",
              grade: "2015",
              className: "行政管理一班",
              cohort: "2019",
              major: "行政管理",
              mode: "全日制本科",
              counselor: "陈老师（示例）",
              mentor: "",
              files: [],
            },
            {
              id: 12,
              domain: "academic_graduate",
              level: "硕士",
              grade: "2019",
              className: "行政管理硕士班",
              cohort: "2022",
              major: "行政管理",
              mode: "全日制研究生",
              counselor: "",
              mentor: "王老师（示例）",
              files: [],
            },
            {
              id: 13,
              domain: "academic_graduate",
              level: "博士",
              grade: "2022",
              className: "公共管理博士班",
              cohort: "",
              major: "公共管理",
              mode: "全日制研究生",
              counselor: "",
              mentor: "李老师（示例）",
              files: [],
            },
          ],
        },
        {
          id: 2,
          name: "李同学",
          gender: "女",
          mobile: "138 **** 0002",
          email: "demo2@example.com",
          industry: "公共服务",
          unit: "示例事业单位",
          position: "工作人员",
          address: "",
          records: [
            {
              id: 21,
              domain: "mpa",
              level: "硕士",
              grade: "2025",
              className: "MPA一班",
              cohort: "",
              major: "MPA",
              mode: "非全日制研究生（含在职研究生）",
              counselor: "",
              mentor: "赵老师（示例）",
              files: [],
            },
          ],
        },
        {
          id: 3,
          name: "王同学",
          gender: "女",
          mobile: "",
          email: "",
          industry: "",
          unit: "",
          position: "",
          address: "",
          records: [],
        },
      ];

      const state = {
        role: "super",
        personId: 1,
        screen: "detail",
        logs: [],
        draft: null,
        tab: "personal",
        upload: null,
        newUrls: [],
      };
      const $ = (s) => document.querySelector(s);
      const esc = (v) =>
        String(v ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const pair = (l, v, cls = "") =>
        `<dl class="pair ${cls}"><dt>${l}</dt><dd>${esc(v || "-")}</dd></dl>`;
      function canEdit() {
        return state.role !== "self";
      }
      function records(p) {
        return p.records.filter(
          (r) => state.role !== "undergraduate" || r.domain === "undergraduate",
        );
      }
      function visiblePeople() {
        return people.filter((p) =>
          state.role === "self"
            ? p.id === 1
            : state.role === "undergraduate"
              ? records(p).length > 0
              : true,
        );
      }
      function person() {
        return (
          visiblePeople().find((p) => p.id === state.personId) ||
          visiblePeople()[0]
        );
      }
      function visibleLogs() {
        return state.role === "self"
          ? []
          : state.logs.filter(
              (l) =>
                l.personId === person().id &&
                (state.role === "super" ||
                  l.domain === "undergraduate" ||
                  l.domain === "shared"),
            );
      }
      function render() {
        const p = person();
        state.personId = p.id;
        $("#viewerName").textContent =
          state.role === "super"
            ? "超级管理员 · 演示"
            : state.role === "self"
              ? "张同学 · 本人视角"
              : "本科管理员 · 演示";
        $("#main").innerHTML = state.screen === "list" ? list() : detail(p);
      }
      function detail(p) {
        return `<div class="page-header"><h1>校友详情</h1>${canEdit() ? '<button data-action="list">← 返回</button>' : ""}</div><section class="card personal-card" aria-label="校友档案"><div class="card-head"><h2>校友档案</h2></div><div class="card-body"><div class="descriptions personal">${pair("姓名", p.name)}${pair("性别", p.gender)}${pair("手机号", p.mobile)}${pair("邮箱", p.email)}${pair("行业", p.industry)}${pair("工作单位", p.unit)}${pair("职务", p.position)}${pair("通讯地址", p.address, "span2")}</div></div></section><section class="academic-section" aria-label="学籍信息"><div class="section-label"><h2>学籍信息</h2></div>${records(p).length ? records(p).map(academic).join("") : '<div class="card empty">暂无学籍信息</div>'}</section>${canEdit() ? history() : ""}`;
      }
      function academic(r) {
        return `<section class="card academic-record" data-record="${r.id}" aria-label="${r.level}学籍"><div class="card-head"><h2>${r.level}学籍</h2><span class="summary-meta">${esc(r.grade)}级 · ${esc(r.major || "专业未填写")}</span></div><div class="card-body"><div class="descriptions academic">${pair("培养层次", r.level)}${pair("年级", r.grade)}${pair("班级", r.className)}${pair("届数", r.cohort)}${pair("专业", r.major)}${pair("培养方式", r.mode)}${pair("辅导员", r.counselor)}${pair("导师", r.mentor)}${pair("管理范围", domains[r.domain])}</div><h3 class="files-heading">学位档案与学籍档案</h3>${fileSection(r, "degree_archive", false)}${fileSection(r, "academic_record", false)}</div></section>`;
      }
      function fileSection(r, type, editing) {
        const files = r.files.filter((f) => f.type === type);
        const title = type === "degree_archive" ? "学位档案" : "学籍档案";
        return `<section class="file-box" aria-label="${title}"><div class="file-box-head"><strong><span class="file-kind ${type === "academic_record" ? "green" : ""}">${title}</span>${files.length} 个文件</strong>${editing ? `<button type="button" class="link" data-upload="${r.id}" data-type="${type}">＋ 上传文件</button>` : ""}</div>${files.length ? files.map((f) => `<div class="file-row"><span>${esc(f.name)} <span class="muted">${(f.size / 1024).toFixed(1)} KB</span></span><div class="file-actions">${f.url ? `<button type="button" class="link" data-download="${f.id}" data-record-id="${r.id}" data-draft="${editing}">下载</button>` : '<span class="muted">示例文件</span>'}${editing ? `<button type="button" class="link danger" data-remove-file="${f.id}" data-record-id="${r.id}">移除</button>` : ""}</div></div>`).join("") : '<div class="file-empty">暂无文件</div>'}</section>`;
      }
      function history() {
        const logs = visibleLogs();
        return `<section class="card audit-card" aria-label="操作历史"><div class="card-head audit-head"><span class="history-mark" aria-hidden="true">◷</span><h2>操作历史 <span class="muted">共 ${logs.length} 条</span></h2></div>${
          logs.length
            ? `<div class="scroll"><table class="audit-table"><thead><tr><th>时间</th><th>操作人</th><th>管理范围</th><th>类型</th><th>操作</th></tr></thead><tbody>${[
                ...logs,
              ]
                .reverse()
                .map(
                  (l) =>
                    `<tr><td>${l.time}</td><td>${l.operator}</td><td><span class="tag">${domains[l.domain] || "个人信息"}</span></td><td><span class="tag action">${l.action}</span></td><td><button class="link" data-audit="${l.id}">详情</button></td></tr>`,
                )
                .join("")}</tbody></table></div>`
            : '<div class="empty-history">暂无操作记录</div>'
        }</section>`;
      }
      function list() {
        return `<div class="page-header"><h1>校友管理</h1></div><div class="card"><div class="card-head"><h2>校友档案</h2></div><div class="scroll"><table class="audit-table"><thead><tr><th>姓名</th><th>性别</th><th>年级 / 专业</th><th>工作单位</th><th>操作</th></tr></thead><tbody>${visiblePeople()
          .map(
            (p) =>
              `<tr><td>${esc(p.name)}</td><td>${p.gender}</td><td>${
                records(p)
                  .map((r) => `${esc(r.grade)}级${r.level} · ${esc(r.major)}`)
                  .join("<br>") || "-"
              }</td><td>${esc(p.unit || "-")}</td><td><div class="editor-action-pair"><button class="link" data-person="${p.id}">查看</button>${canEdit() ? `<button class="link" data-edit-person="${p.id}">编辑</button>` : ""}</div></td></tr>`,
          )
          .join("")}</tbody></table></div></div>`;
      }
      const personFields = {
        name: "姓名",
        gender: "性别",
        mobile: "手机号",
        email: "邮箱",
        industry: "行业",
        unit: "工作单位",
        position: "职务",
        address: "通讯地址",
      };
      const recordFields = {
        domain: "培养类别",
        level: "培养层次",
        grade: "年级",
        className: "班级",
        cohort: "届数",
        major: "专业",
        mode: "培养方式",
        counselor: "辅导员",
        mentor: "导师",
        remark: "管理员备注",
      };
      const industryOptions = [
        "党政机关",
        "事业单位",
        "国有企业",
        "民营企业",
        "高校科研",
        "金融",
        "医疗卫生",
        "社会组织",
        "其他",
      ];
      function selectOptions(values, current, empty = true) {
        return `${empty ? '<option value="">请选择</option>' : ""}${[...new Set([current, ...values].filter(Boolean))].map((v) => `<option value="${esc(v)}" ${v === current ? "selected" : ""}>${esc(v)}</option>`).join("")}`;
      }
      function control(label, value, attrs, kind = "input", options = []) {
        const required = attrs.includes("data-required");
        if (required) attrs += ' aria-required="true"';
        const content =
          kind === "textarea"
            ? `<textarea ${attrs} rows="3" maxlength="255">${esc(value)}</textarea>`
            : kind === "select"
              ? `<select ${attrs}>${selectOptions(options, value, !required)}</select>`
              : `<input ${attrs} value="${esc(value)}" maxlength="${label === "姓名" ? "100" : label === "年级" ? "50" : "255"}">`;
        return `<label class="${kind === "textarea" ? "full" : ""}"><span>${label}${required ? '<span class="required" aria-hidden="true">*</span>' : ""}</span>${content}</label>`;
      }
      function renderPersonalForm() {
        const p = state.draft;
        $("#personalPanel").innerHTML =
          `<div class="editor-fields">${control("姓名", p.name, 'data-person-field="name" data-required')}${control("性别", p.gender, 'data-person-field="gender"', "select", ["男", "女", "未填"])}${control("手机号", p.mobile, 'data-person-field="mobile"')}${control("邮箱", p.email, 'data-person-field="email"')}${control("行业", p.industry, 'data-person-field="industry"', "select", industryOptions)}${control("工作单位", p.unit, 'data-person-field="unit"')}${control("职务", p.position, 'data-person-field="position"')}${control("通讯地址", p.address, 'data-person-field="address"', "textarea")}</div>`;
      }
      function renderRecordsForm() {
        const rows = records(state.draft);
        $("#recordsPanel").innerHTML =
          `${state.role === "undergraduate" ? '<p class="edit-notice">当前仅维护本科生范围内的学籍与档案。</p>' : ""}${
            rows.length
              ? rows
                  .map((r) => {
                    const isNew = !person().records.some((x) => x.id === r.id);
                    const attr = (k) =>
                      `data-record-field="${k}" data-record-id="${r.id}"`;
                    const domainOpts = (
                      state.role === "undergraduate"
                        ? ["undergraduate"]
                        : Object.keys(domains)
                    )
                      .map(
                        (k) =>
                          `<option value="${k}" ${r.domain === k ? "selected" : ""}>${domains[k]}</option>`,
                      )
                      .join("");
                    return `<section class="edit-record" aria-label="${r.level}学籍表单" data-edit-record="${r.id}"><div class="edit-record-head"><h3>${r.level}学籍${isNew ? ' <span class="tag">新增</span>' : ""}</h3>${isNew ? `<button type="button" class="link danger" data-remove-new="${r.id}">移除本次新增</button>` : ""}</div><div class="edit-record-body"><div class="editor-fields"><label><span>培养类别<span class="required" aria-hidden="true">*</span></span><select ${attr("domain")} ${!isNew || state.role === "undergraduate" ? "disabled" : ""}>${domainOpts}</select></label>${control("培养层次", r.level, attr("level") + " data-required", "select", r.domain === "undergraduate" ? ["本科"] : r.domain === "mpa" ? ["硕士"] : ["硕士", "博士"])}${control("年级", r.grade, attr("grade") + " data-required")}${control("班级", r.className, attr("className"))}${control("届数", r.cohort, attr("cohort"))}${control("专业", r.major, attr("major"))}${control("培养方式", r.mode, attr("mode"), "select", ["全日制", "非全日制", "定向", "其他"])}${control("辅导员", r.counselor, attr("counselor"))}${control("导师", r.mentor, attr("mentor"))}${control("管理员备注", r.remark, attr("remark"), "textarea")}</div><h3 class="files-heading">学位档案与学籍档案</h3>${fileSection(r, "degree_archive", true)}${fileSection(r, "academic_record", true)}</div></section>`;
                  })
                  .join("")
              : '<div class="empty">暂无学籍，请添加第一段学籍。</div>'
          }<div class="edit-section-foot"><button type="button" data-action="add-draft">＋ 添加一段学籍</button><small>同一校友可添加多段本科、硕士或博士学籍。</small></div>`;
      }
      function switchTab(tab) {
        state.tab = tab;
        $("#personalPanel").hidden = tab !== "personal";
        $("#recordsPanel").hidden = tab !== "records";
        for (const t of ["personal", "records"]) {
          const b = $("#" + t + "Tab");
          b.classList.toggle("active", tab === t);
          b.setAttribute("aria-selected", String(tab === t));
        }
        $("#editorScroll").scrollTop = 0;
      }
      function openEditor(id) {
        if (!canEdit()) return;
        const p = visiblePeople().find((x) => x.id === Number(id));
        if (!p) return;
        state.personId = p.id;
        state.draft = structuredClone(p);
        state.newUrls = [];
        $("#editContext").textContent =
          `${p.name} · 个人信息共用一份，各段学籍与档案分别维护。`;
        $("#formError").hidden = true;
        renderPersonalForm();
        renderRecordsForm();
        switchTab("personal");
        $("#editor").showModal();
      }
      function cancelDraft() {
        state.newUrls.forEach((u) => URL.revokeObjectURL(u));
        state.newUrls = [];
        state.draft = null;
      }
      $("#editor").addEventListener("cancel", () => cancelDraft());
      $("#editor").addEventListener("close", () => {
        if (state.draft) cancelDraft();
      });
      function updateDraft(e) {
        const t = e.target;
        if (!state.draft) return;
        if (t.dataset.personField) state.draft[t.dataset.personField] = t.value;
        if (t.dataset.recordField) {
          const r = records(state.draft).find(
            (x) => x.id === Number(t.dataset.recordId),
          );
          if (!r) return;
          const k = t.dataset.recordField;
          if (k === "domain") {
            if (person().records.some((x) => x.id === r.id)) return;
            if (state.role === "undergraduate" && t.value !== "undergraduate")
              return;
            r.domain = t.value;
            r.level = r.domain === "undergraduate" ? "本科" : "硕士";
            renderRecordsForm();
            return;
          }
          r[k] = t.value;
          if (k === "level") renderRecordsForm();
        }
      }
      $("#alumniForm").addEventListener("input", updateDraft);
      $("#alumniForm").addEventListener("change", updateDraft);
      function addLog(domain, title, action, changes) {
        state.logs.push({
          id: Date.now() + Math.random(),
          personId: person().id,
          domain,
          title,
          action,
          changes,
          time: new Date().toLocaleString("zh-CN", {
            timeZone: "Asia/Shanghai",
            hour12: false,
          }),
          operator:
            state.role === "super"
              ? "超级管理员（演示）"
              : "本科管理员（演示）",
        });
      }
      function fail(message, tab, selector) {
        switchTab(tab);
        $("#formError").textContent = message;
        $("#formError").hidden = false;
        $(selector)?.focus();
      }
      $("#alumniForm").addEventListener("submit", (e) => {
        e.preventDefault();
        if (!state.draft || !canEdit()) return;
        const draft = state.draft;
        for (const k of Object.keys(personFields))
          draft[k] = (draft[k] || "").trim();
        if (!draft.name)
          return fail(
            "请输入姓名，不能只有空格。",
            "personal",
            '[data-person-field="name"]',
          );
        for (const r of records(draft)) {
          for (const k of Object.keys(recordFields)) r[k] = (r[k] || "").trim();
          if (!r.grade)
            return fail(
              "请填写每一段学籍的年级。",
              "records",
              `[data-record-id="${r.id}"][data-record-field="grade"]`,
            );
        }
        const before = person();
        const personalChanges = Object.keys(personFields)
          .filter((k) => (before[k] || "") !== draft[k])
          .map((k) => ({
            field: personFields[k],
            before: before[k] || "-",
            after: draft[k] || "-",
          }));
        if (personalChanges.length)
          addLog("shared", "个人信息", "修改", personalChanges);
        for (const r of records(draft)) {
          const prev = before.records.find((x) => x.id === r.id);
          const changes = Object.keys(recordFields)
            .filter((k) => (prev?.[k] || "") !== r[k])
            .map((k) => ({
              field: recordFields[k],
              before:
                k === "domain" ? domains[prev?.[k]] || "-" : prev?.[k] || "-",
              after: k === "domain" ? domains[r[k]] : r[k] || "-",
            }));
          for (const type of ["degree_archive", "academic_record"]) {
            const a = (prev?.files || [])
              .filter((f) => f.type === type)
              .map((f) => f.name)
              .join("、");
            const b = r.files
              .filter((f) => f.type === type)
              .map((f) => f.name)
              .join("、");
            if (a !== b)
              changes.push({
                field: type === "degree_archive" ? "学位档案" : "学籍档案",
                before: a || "-",
                after: b || "-",
              });
          }
          if (changes.length)
            addLog(
              r.domain,
              `${r.grade}级${r.level}学籍`,
              prev ? "修改" : "新增",
              changes,
            );
        }
        const keptUrls = new Set(
          draft.records.flatMap((r) => r.files.map((f) => f.url)),
        );
        before.records
          .flatMap((r) => r.files)
          .forEach((f) => {
            if (f.url && !keptUrls.has(f.url)) URL.revokeObjectURL(f.url);
          });
        state.newUrls
          .filter((u) => !keptUrls.has(u))
          .forEach((u) => URL.revokeObjectURL(u));
        people[people.indexOf(before)] = draft;
        state.draft = null;
        state.newUrls = [];
        $("#editor").close();
        render();
        toast("全部修改已保存到本次预览，刷新后恢复示例。");
      });
      let toastTimer;
      function toast(msg) {
        $("#toast").textContent = msg;
        $("#toast").hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => ($("#toast").hidden = true), 3500);
      }
      $("#fileInput").addEventListener("change", (e) => {
        const f = e.target.files[0];
        e.target.value = "";
        if (!f || !state.draft || !state.upload) return;
        const r = records(state.draft).find(
          (x) => x.id === state.upload.recordId,
        );
        if (!r) return;
        if (!/\.(pdf|doc|docx|jpg|jpeg|png)$/i.test(f.name))
          return toast("请选择 PDF、Word、JPG 或 PNG 文件。");
        if (f.size > 50 * 1024 * 1024) return toast("单文件不能超过 50MB。");
        const url = URL.createObjectURL(f);
        state.newUrls.push(url);
        r.files.push({
          id: Date.now(),
          name: f.name,
          size: f.size,
          type: state.upload.type,
          url,
        });
        renderRecordsForm();
        toast("文件已加入草稿，保存全部修改后生效。");
      });
      $("#role").addEventListener("change", (e) => {
        document.querySelectorAll("dialog[open]").forEach((d) => d.close());
        cancelDraft();
        state.role = e.target.value;
        state.personId = 1;
        state.screen = "detail";
        render();
      });
      document.addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        if (b.dataset.close) {
          $("#" + b.dataset.close).close();
          return;
        }
        if (b.dataset.tab) {
          switchTab(b.dataset.tab);
          return;
        }
        if (b.dataset.action === "list") {
          state.screen = "list";
          render();
          return;
        }
        if (b.dataset.person) {
          state.personId = Number(b.dataset.person);
          state.screen = "detail";
          render();
          return;
        }
        if (b.dataset.editPerson) {
          openEditor(b.dataset.editPerson);
          return;
        }
        if (b.dataset.action === "add-draft" && state.draft) {
          const domain =
            state.role === "undergraduate"
              ? "undergraduate"
              : "academic_graduate";
          state.draft.records.push({
            id: Date.now(),
            domain,
            level: domain === "undergraduate" ? "本科" : "硕士",
            grade: "",
            className: "",
            cohort: "",
            major: "",
            mode: "",
            counselor: "",
            mentor: "",
            remark: "",
            files: [],
          });
          renderRecordsForm();
          $("#editorScroll").scrollTop = $("#editorScroll").scrollHeight;
          return;
        }
        if (b.dataset.removeNew && state.draft) {
          const id = Number(b.dataset.removeNew);
          if (person().records.some((r) => r.id === id)) return;
          state.draft.records = state.draft.records.filter((r) => r.id !== id);
          renderRecordsForm();
          return;
        }
        if (b.dataset.upload && state.draft) {
          state.upload = {
            recordId: Number(b.dataset.upload),
            type: b.dataset.type,
          };
          $("#fileInput").click();
          return;
        }
        if (b.dataset.removeFile && state.draft) {
          const r = records(state.draft).find(
            (x) => x.id === Number(b.dataset.recordId),
          );
          if (r) {
            r.files = r.files.filter(
              (f) => f.id !== Number(b.dataset.removeFile),
            );
            renderRecordsForm();
          }
          return;
        }
        if (b.dataset.download) {
          const p = b.dataset.draft === "true" ? state.draft : person();
          const r = records(p).find((x) => x.id === Number(b.dataset.recordId)),
            f = r?.files.find((x) => x.id === Number(b.dataset.download));
          if (!f?.url) return;
          const a = document.createElement("a");
          a.href = f.url;
          a.download = f.name;
          a.click();
          return;
        }
        if (b.dataset.audit) {
          const log = visibleLogs().find(
            (l) => String(l.id) === b.dataset.audit,
          );
          if (!log) return;
          $("#auditBody").innerHTML =
            `<p style="margin-bottom:16px">${esc(log.title)} · ${esc(log.action)}</p><table class="diff-table"><thead><tr><th>字段</th><th>修改前</th><th>修改后</th></tr></thead><tbody>${log.changes.map((c) => `<tr><td>${esc(c.field)}</td><td>${esc(c.before)}</td><td>${esc(c.after)}</td></tr>`).join("")}</tbody></table>`;
          $("#auditDetail").showModal();
        }
      });
      const query = new URLSearchParams(location.search);
      if (query.get("screen") === "list") state.screen = "list";
      render();
      if (query.get("edit") === "1" && canEdit()) {
        state.screen = "list";
        render();
        openEditor(1);
      }
    </script>
  </body>
</html>
