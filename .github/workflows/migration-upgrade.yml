name: Migration upgrade path

# runner 显式固定为 ubuntu-26.04：与生产服务器（Ubuntu 26.04 LTS）保持一致，
# 同时避免 ubuntu-latest 灰度迁移到 Ubuntu 26 期间镜像版本不确定（见 #195）。

# 由 Nightly 与 Release 通过 workflow_call 复用；不进 PR 门禁。
on:
  workflow_call:

permissions:
  contents: read

jobs:
  upgrade:
    name: Migration upgrade path
    runs-on: ubuntu-26.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: sdu_alumni_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptest-password
          --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: test-password
      MYSQL_DATABASE: sdu_alumni_db
      # service 提供的数据库可丢弃，允许脚本重建以保持重跑确定。
      RESET_DATABASE: "1"
    steps:
      # v5.1.0
      # 需要完整历史与标签，才能取到上一个发布标签的迁移集。
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Verify the old-volume upgrade path
        run: bash .github/scripts/check-migration-upgrade.sh
      - name: Verify the pre-tracking volume upgrade path (v0.3.1)
        env:
          BASE_TAG: v0.3.1
        run: bash .github/scripts/check-migration-upgrade.sh
      - name: Verify the fallback (N-1) upgrade path
        env:
          BASE_TAG: HEAD
        run: bash .github/scripts/check-migration-upgrade.sh
