name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-message:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Validate Conventional Commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore)\([a-z0-9][a-z0-9._/-]*\)!?: .+$'
          invalid=0
          while IFS= read -r subject; do
            if ! [[ "$subject" =~ $pattern ]]; then
              echo "不符合提交规范：$subject" >&2
              invalid=1
            fi
          done < <(git log --format=%s "$BASE_SHA..$HEAD_SHA")
          if [ "$invalid" -ne 0 ]; then
            echo '提交标题必须为 type(scope): 描述，例如 feat(alumni): 新增校友导出。' >&2
            echo '允许的 type：feat、fix、docs、style、refactor、perf、test、build、ci、chore；scope 使用小写模块名。' >&2
            exit 1
          fi

  issue-link:
    name: Linked issue
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require an auto-closing Issue reference
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! printf '%s' "$PR_BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+'; then
            echo 'PR 描述必须使用 Closes #编号、Fixes #编号 或 Resolves #编号关联 Issue。' >&2
            exit 1
          fi

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go mod download
      - name: Check Go formatting
        run: test -z "$(gofmt -l $(find . -name '*.go' -type f))"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./cmd/api

  web:
    name: Web quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  e2e:
    name: E2E
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests in an isolated Compose environment
        env:
          E2E_SKIP_BROWSER_INSTALL: "true"
          E2E_COMPOSE_PROJECT: sdu-alumni-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run test:e2e
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  integration:
    name: Integration and migration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: sdu_alumni_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptest-password --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      minio:
        image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
        command: server /data
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin123
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl --fail --silent http://127.0.0.1:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: server
    env:
      TEST_MYSQL_DSN: root:test-password@tcp(127.0.0.1:3306)/sdu_alumni_db?charset=utf8mb4&parseTime=true&loc=Local
      TEST_REDIS_ADDR: 127.0.0.1:6379
      TEST_MINIO_ENDPOINT: 127.0.0.1:9000
      TEST_MINIO_ACCESS_KEY: minioadmin
      TEST_MINIO_SECRET_KEY: minioadmin123
      TEST_MINIO_BUCKET: sdu-alumni-integration-test
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Apply every migration to a clean database
        run: |
          for migration in migrations/*.sql; do
            mysql -h 127.0.0.1 -uroot -ptest-password sdu_alumni_db < "$migration"
          done
          test "$(mysql -N -h 127.0.0.1 -uroot -ptest-password sdu_alumni_db -e "SHOW TABLES LIKE 'users'")" = "users"
          test "$(mysql -N -h 127.0.0.1 -uroot -ptest-password sdu_alumni_db -e "SHOW TABLES LIKE 'alumni_profiles'")" = "alumni_profiles"
      - run: go test -race -count=1 ./...

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Scan Go dependencies reachable by this project
        working-directory: server
        run: bash "$GITHUB_WORKSPACE/.github/scripts/govulncheck.sh"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Scan production npm dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  containers:
    name: Containers and health checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Validate Compose configuration
        run: docker compose config -q
      - name: Build images
        run: |
          docker build --tag sdu-alumni-api-ci ./server
          docker build --tag sdu-alumni-web-ci ./web
      - name: Verify API liveness and readiness without optional services
        run: |
          docker run --detach --name sdu-alumni-api-ci --publish 18080:8080 --env DB_ENABLED=false --env REDIS_ENABLED=false --env STORAGE_ENABLED=false sdu-alumni-api-ci
          trap 'docker logs sdu-alumni-api-ci; docker rm -f sdu-alumni-api-ci' EXIT
          for attempt in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:18080/api/v1/health/live && curl --fail --silent http://127.0.0.1:18080/api/v1/health/ready && exit 0
            sleep 2
          done
          exit 1
      - name: Verify web container serves the built application
        run: |
          docker run --detach --name sdu-alumni-web-ci --publish 18081:80 --add-host api:127.0.0.1 --add-host minio:127.0.0.1 sdu-alumni-web-ci
          trap 'docker logs sdu-alumni-web-ci; docker rm -f sdu-alumni-web-ci' EXIT
          for attempt in $(seq 1 10); do
            curl --fail --silent http://127.0.0.1:18081/ > /dev/null && exit 0
            sleep 2
          done
          exit 1
