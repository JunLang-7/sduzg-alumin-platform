name: CI

# runner 显式固定为 ubuntu-26.04：与生产服务器（Ubuntu 26.04 LTS）保持一致，
# 同时避免 ubuntu-latest 灰度迁移到 Ubuntu 26 期间镜像版本不确定（见 #195）。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Nightly 与 Release 工作流复用它作为统一质量门禁。
  workflow_call:
    inputs:
      run_e2e:
        description: 非 PR 场景（Nightly、Release）下是否运行浏览器端到端测试
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-message:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Validate Conventional Commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          types='feat|fix|docs|style|refactor|perf|test|build|ci|chore'
          pattern="^(${types})\([a-z0-9][a-z0-9._/-]*\)!?: .+$"
          invalid=0
          while IFS= read -r subject; do
            if ! [[ "$subject" =~ $pattern ]]; then
              echo "不符合提交规范：$subject" >&2
              invalid=1
            fi
          done < <(git log --format=%s "$BASE_SHA..$HEAD_SHA")
          if [ "$invalid" -ne 0 ]; then
            echo '提交标题必须为 type(scope): 描述，例如 feat(alumni): 新增校友导出。' >&2
            types_msg='允许的 type：feat、fix、docs、style、refactor、perf、'
            types_msg="${types_msg}test、build、ci、chore；scope 使用小写模块名。"
            echo "$types_msg" >&2
            exit 1
          fi

  issue-link:
    name: Linked issue
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Test Issue reference policy
        run: bash .github/scripts/check-linked-issue.test.sh
      - name: Require an auto-closing Issue reference
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: bash .github/scripts/check-linked-issue.sh

  wiki-sync:
    name: Wiki sync
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Test wiki synchronization without remote access
        run: bash .github/scripts/sync-wiki.test.sh

  backend:
    name: Backend quality
    runs-on: ubuntu-26.04
    # 必须给硬上限：没有上限时，runner 被宿主回收只会留下 SIGTERM（退出码 143），
    # 无法和「测试卡住」区分。见 #217。
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go mod download
      - name: Check Go formatting
        run: test -z "$(gofmt -l $(find . -name '*.go' -type f))"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./cmd/api
      - name: Verify generated interface docs are up to date
        working-directory: .
        run: |
          make swagger-tool
          make swagger
          if [ -n "$(git status --porcelain -- server/internal/docs)" ];
          then
            git --no-pager diff --stat -- server/internal/docs
            echo '接口注解与生成结果不一致，请在仓库根目录运行 make swagger 并提交。' >&2
            exit 1
          fi

  web:
    name: Web quality
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  e2e:
    name: E2E
    if: github.event_name == 'pull_request' || inputs.run_e2e
    runs-on: ubuntu-26.04
    # 这 10 分钟里包含 npm ci、Chromium 与系统依赖下载、整套 Compose E2E。正常约 3.5 分钟，
    # 但浏览器下载一旦变慢就会把整个 job 拖到超时（v0.5.1 发版时卡在 Install Chromium 整整
    # 10 分钟后被判定 cancelled）。留出下载抖动的余量，真正的挂起仍由超时拦住。
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests in an isolated Compose environment
        env:
          E2E_SKIP_BROWSER_INSTALL: "true"
          E2E_COMPOSE_PROJECT: >-
            sdu-alumni-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run test:e2e
      - name: Upload E2E diagnostics
        if: failure()
        # v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  integration:
    name: Integration and migration
    runs-on: ubuntu-26.04
    # 集成测试会真实连 MySQL/Redis/MinIO；没有硬上限时，外部中断只会表现为
    # 退出码 143（SIGTERM），无法区分“测试挂了”和“作业被取消”。这里给出明确上限，
    # 超时会标记为超时而不是静默被杀。
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: sdu_alumni_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptest-password
          --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      minio:
        image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
        # 实测：不写 command 时 silo 镜像只打印版本号就退出，健康检查无法通过。
        # actionlint 的 services schema 未收录该键，但 GitHub 会使用它。
        command: server /data
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin123
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl --fail --silent
          http://127.0.0.1:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: server
    env:
      TEST_MYSQL_DSN: "root:test-password@tcp(127.0.0.1:3306)/sdu_alumni_db\
        ?charset=utf8mb4&parseTime=true&loc=UTC&time_zone=%27%2B00%3A00%27"
      TEST_REDIS_ADDR: 127.0.0.1:6379
      TEST_MINIO_ENDPOINT: 127.0.0.1:9000
      TEST_MINIO_ACCESS_KEY: minioadmin
      TEST_MINIO_SECRET_KEY: minioadmin123
      TEST_MINIO_BUCKET: sdu-alumni-integration-test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Apply every migration to a clean database
        run: |
          for migration in migrations/*.sql; do
            mysql -h 127.0.0.1 -uroot -ptest-password sdu_alumni_db \
              < "$migration"
          done
          users_table="$(mysql -N -h 127.0.0.1 -uroot -ptest-password \
            sdu_alumni_db -e "SHOW TABLES LIKE 'users'")"
          test "$users_table" = "users"
          profiles_table="$(mysql -N -h 127.0.0.1 -uroot -ptest-password \
            sdu_alumni_db -e "SHOW TABLES LIKE 'alumni_profiles'")"
          test "$profiles_table" = "alumni_profiles"
      - name: Run Go tests against MySQL, Redis and MinIO
        run: go test -race -count=1 -timeout 20m ./...

  security:
    name: Security
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Scan Go dependencies reachable by this project
        working-directory: server
        run: bash "$GITHUB_WORKSPACE/.github/scripts/govulncheck.sh"
      # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Scan production npm dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  containers:
    name: Containers and health checks
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Test the release artifact check
        run: bash .github/scripts/check-release-artifacts.test.sh
      - name: Test the run failure classifier
        run: bash .github/scripts/classify-run-failure.test.sh
      - name: Validate Compose configuration
        run: docker compose config -q
      - name: Build images
        run: |
          docker build --tag sdu-alumni-api-ci ./server
          docker build --tag sdu-alumni-web-ci ./web
      - name: Verify API liveness and readiness without optional services
        run: |
          docker run --detach --name sdu-alumni-api-ci \
            --publish 18080:8080 \
            --env DB_ENABLED=false \
            --env REDIS_ENABLED=false \
            --env STORAGE_ENABLED=false \
            sdu-alumni-api-ci
          trap 'docker logs sdu-alumni-api-ci; docker rm -f sdu-alumni-api-ci' \
            EXIT
          live=http://127.0.0.1:18080/api/v1/health/live
          ready=http://127.0.0.1:18080/api/v1/health/ready
          for attempt in $(seq 1 20); do
            if curl --fail --silent "$live" \
              && curl --fail --silent "$ready"; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Verify web container serves the built application
        run: |
          docker run --detach --name sdu-alumni-web-ci \
            --publish 18081:80 \
            --add-host api:127.0.0.1 \
            --add-host minio:127.0.0.1 \
            sdu-alumni-web-ci
          trap 'docker logs sdu-alumni-web-ci; docker rm -f sdu-alumni-web-ci' \
            EXIT
          base=http://127.0.0.1:18081
          for attempt in $(seq 1 10); do
            if curl --fail --silent "$base/" > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent "$base/" > /dev/null
          # 入口 HTML 必须协商缓存，否则发版后浏览器可能长期停留在旧版本。
          cache_control() {
            curl --silent --head "$1" \
              | tr -d '\r' \
              | awk -F': ' 'tolower($1)=="cache-control" {print $2; exit}'
          }
          test "$(cache_control "$base/")" = "no-cache"
          test "$(cache_control "$base/index.html")" = "no-cache"
          test "$(cache_control "$base/admin/alumni")" = "no-cache"
          # 带内容 hash 的构建产物应长期缓存。
          asset="$(curl --fail --silent "$base/" \
            | grep -o '/assets/[^"]*\.js' | head -1)"
          test -n "$asset"
          test "$(cache_control "$base$asset")" \
            = "public, max-age=31536000, immutable"
          # /assets/ 必须独立于 SPA 回退：不存在的产物要 404，不能返回 200 text/html。
          # 同时防止有人删掉 /assets/ 的 location（那会让带 hash 的资源退回无缓存策略）。
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "$base/assets/__missing__.js")" = "404"
          # server_tokens off 后只暴露产品名，不动点版本号用于减少指纹信息。
          curl --silent --head "$base/" \
            | tr -d '\r' \
            | grep -q '^Server: nginx$'
          # no-cache 必须配合 ETag 才能退化为 304；否则每次刷新都会全量下发 HTML。
          etag="$(curl --silent --head "$base/" \
            | tr -d '\r' \
            | awk -F': ' 'tolower($1)=="etag" {print $2; exit}')"
          test -n "$etag"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "If-None-Match: $etag" "$base/")" = "304"
