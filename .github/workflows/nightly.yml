name: Nightly

# runner 显式固定为 ubuntu-26.04：与生产服务器（Ubuntu 26.04 LTS）保持一致，
# 同时避免 ubuntu-latest 灰度迁移到 Ubuntu 26 期间镜像版本不确定（见 #195）。
on:
  # 每天 02:00（北京时间，UTC+8）在仓库默认分支 main 上执行一次。
  schedule:
    - cron: "0 18 * * *"
  # 手动触发时使用所选分支。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Full quality gate
    uses: ./.github/workflows/ci.yml
    with:
      run_e2e: true

  migration-upgrade:
    name: Migration upgrade path
    uses: ./.github/workflows/migration-upgrade.yml

  # 托管 runner 被宿主回收时，job 只留下 SIGTERM（退出码 143），和真实失败长得一模一样。
  # 这里把两者分开：真实失败只报告不重跑，被回收则自动重跑（见 #217）。
  diagnose:
    name: Diagnose failure
    needs: [quality, migration-upgrade]
    if: failure()
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Classify the failure
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/classify-run-failure.sh

  rerun-infra-failure:
    name: Re-run on infrastructure failure
    needs: [diagnose]
    # 只在「所有失败 job 都只剩 runner 被回收的痕迹」时自动重跑，最多 2 次；
    # 真实失败绝不自动重跑，避免把代码问题刷成绿灯。
    if: needs.diagnose.outputs.kind == 'infra' && github.run_attempt < 3
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Re-run the whole workflow
        # 整体重跑而不是只重跑失败 job：Nightly artifacts 依赖 quality 成功，
        # 只重跑失败 job 会让这一个成功的产物永远缺失。
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/rerun"

  artifacts:
    name: Nightly artifacts
    needs: [quality, migration-upgrade]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      # v5.1.0
      # 不上传凭据到构建产物。
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build API binary
        working-directory: server
        run: |
          mkdir -p ../nightly-artifacts
          out=../nightly-artifacts/sdu-alumni-api-linux-amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -o "$out" ./cmd/api
      - name: Smoke test the nightly binary
        run: |
          bash .github/scripts/check-api-binary.sh \
            nightly-artifacts/sdu-alumni-api-linux-amd64
      # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web assets
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Package artifacts
        run: |
          tar -czf nightly-artifacts/sdu-alumni-web-dist.tar.gz -C web/dist .
          base="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          {
            echo "channel=nightly"
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run=${base}/actions/runs/${GITHUB_RUN_ID}"
          } > nightly-artifacts/BUILD_INFO.txt
          cd nightly-artifacts
          sha256sum sdu-alumni-api-linux-amd64 \
            sdu-alumni-web-dist.tar.gz > SHA256SUMS
      - name: Upload nightly artifacts
        # v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nightly-${{ github.run_id }}
          path: nightly-artifacts
          if-no-files-found: error
          retention-days: 14
