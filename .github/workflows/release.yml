name: Release

# runner 显式固定为 ubuntu-26.04：与生产服务器（Ubuntu 26.04 LTS）保持一致，
# 同时避免 ubuntu-latest 灰度迁移到 Ubuntu 26 期间镜像版本不确定（见 #195）。
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      # v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - id: tag
        name: Check tag format and release branch
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pattern='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          if ! [[ "$TAG" =~ $pattern ]]; then
            echo "::error::标签必须为 vX.Y.Z 或 vX.Y.Z-预发布标识：$TAG"
            exit 1
          fi
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          # 正式版与预发布均从 main 上的提交打标签。
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::版本标签必须指向 main 上的提交"
            echo "::error::请先通过 PR 将改动合并到 main，再在 main 上打标签"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  quality:
    name: Full quality gate
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      run_e2e: true

  migration-upgrade:
    name: Migration upgrade path
    uses: ./.github/workflows/migration-upgrade.yml

  # 托管 runner 被宿主回收时，job 只留下 SIGTERM（退出码 143），和真实失败长得一模一样。
  # 发版最容易被这种拖动卡住，所以复用 Nightly 的判定与自动重跑（见 #217、#223）。
  diagnose:
    name: Diagnose failure
    needs: [quality, migration-upgrade]
    if: failure()
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Classify the failure
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/classify-run-failure.sh

  rerun-infra-failure:
    name: Re-run on infrastructure failure
    needs: [diagnose]
    # 只在「所有失败 job 都只剩 runner 被回收的痕迹」时自动重跑，最多 2 次；
    # 真实失败绝不自动重跑，避免把代码问题刷成绿灯。
    if: needs.diagnose.outputs.kind == 'infra' && github.run_attempt < 3
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Re-run the whole workflow
        # 整体重跑而不是只重跑失败 job：build 依赖 quality 与 migration-upgrade，
        # 只重跑失败 job 会留下已成功的产物与最终重跑出来的结果对不上。
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/rerun"

  build:
    name: Build release artifacts
    needs: [validate, quality, migration-upgrade]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      # v5.1.0
      # 不上传凭据到构建产物。
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build API binary
        working-directory: server
        run: |
          mkdir -p ../release-artifacts
          out=../release-artifacts/sdu-alumni-api-linux-amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" -o "$out" ./cmd/api
      - name: Smoke test the released binary
        run: |
          bash .github/scripts/check-api-binary.sh \
            release-artifacts/sdu-alumni-api-linux-amd64
      # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web assets
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Package artifacts
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          tar -czf release-artifacts/sdu-alumni-web-dist.tar.gz -C web/dist .
          base="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          {
            echo "version=${TAG}"
            echo "channel=${TAG#v}"
            echo "commit=${GITHUB_SHA}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run=${base}/actions/runs/${GITHUB_RUN_ID}"
          } > release-artifacts/BUILD_INFO.txt
          cd release-artifacts
          sha256sum sdu-alumni-api-linux-amd64 \
            sdu-alumni-web-dist.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Verify the packaged artifacts
        run: bash .github/scripts/check-release-artifacts.sh release-artifacts
      - name: Upload release artifacts
        # v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-${{ needs.validate.outputs.tag }}
          path: release-artifacts
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # 在仓库 Settings → Environments 为 release 环境配置 required reviewers 后，
    # 打标签不会直接对外发布，需要人工放行。
    environment: release
    permissions:
      contents: write
    steps:
      # v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      # v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-${{ needs.validate.outputs.tag }}
          path: release-artifacts
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          notes_file="docs/release-notes/$TAG.md"
          title="$TAG"
          args=()
          if [ -f "$notes_file" ]; then
            first_line="$(head -n 1 "$notes_file")"
            case "$first_line" in
              "# "*) title="${first_line#\# }" ;;
            esac
            args+=(--notes-file "$notes_file")
          else
            args+=(--generate-notes)
          fi
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}" --title "$title" \
            --verify-tag release-artifacts/*
          echo "已创建 Release：$TAG"
