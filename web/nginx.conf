server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MinIO 直传代理：浏览器通过同源请求上传文件，nginx 用内部 Host 转发以匹配预签名签名
    client_max_body_size 60m;
    location /sdu-alumni-files/ {
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host minio:9000;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 入口 HTML 每次使用前都要向服务器校验（no-cache 允许缓存但必须重新验证），
    # 否则浏览器会按启发式缓存旧的 index.html，发版后仍加载旧 hash 的前端资源。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA 前缀路由与根路径都由这里返回入口 HTML；深层路由经 try_files 回退时
    # 会内部重定向到 /index.html，命中上面的精确 location。
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Vite 构建产物文件名带内容 hash，内容变化必然产生新文件名，可长期缓存。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
}
